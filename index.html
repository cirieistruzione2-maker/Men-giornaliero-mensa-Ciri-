<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menù del Giorno · Città di Ciriè</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFF8EC;
    --paper-2:#FFEFD6;
    --card:#FFFFFF;
    --ink:#2A2140;
    --ink-soft:#6B5E7D;
    --ink-faint:#A79BB8;
    --line:#EADFF2;

    --estivo:#FF8A3D;
    --estivo-ink:#8A3B0A;
    --estivo-soft:#FFE2BC;
    --estivo-deep:#E85D1D;

    --invernale:#2F80ED;
    --invernale-ink:#123B77;
    --invernale-soft:#D2E7FF;
    --invernale-deep:#1C64D1;

    --speciale:#B84FE0;
    --speciale-ink:#5B1E7A;
    --speciale-soft:#F2DCFB;
    --speciale-deep:#9430C2;

    --closed:#8F9BB3;
    --closed-soft:#E9ECF5;

    --radius-lg:20px;
    --radius-md:12px;
    --shadow: 0 1px 2px rgba(42,33,64,0.07), 0 14px 34px -14px rgba(42,33,64,0.28);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(900px 500px at 8% -8%, #FFD9A6 0%, transparent 55%),
      radial-gradient(900px 550px at 95% 0%, #BFE3FF 0%, transparent 55%),
      radial-gradient(1000px 700px at 50% 115%, #E7C8FF 0%, transparent 55%),
      var(--paper);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:40px 18px 70px;
    transition:background .5s ease;
  }
  body.season-estivo{
    background:
      radial-gradient(900px 550px at 10% -10%, #FFDCA8 0%, transparent 55%),
      radial-gradient(900px 550px at 100% 10%, #FFC7A0 0%, transparent 60%),
      radial-gradient(1000px 700px at 50% 115%, #FFEAB8 0%, transparent 55%),
      var(--paper);
    background-attachment:fixed;
  }
  body.season-invernale{
    background:
      radial-gradient(900px 550px at 10% -10%, #CBE7FF 0%, transparent 55%),
      radial-gradient(900px 550px at 100% 10%, #D6D2FF 0%, transparent 60%),
      radial-gradient(1000px 700px at 50% 115%, #DDEFFF 0%, transparent 55%),
      var(--paper);
    background-attachment:fixed;
  }
  body.season-speciale{
    background:
      radial-gradient(900px 550px at 10% -10%, #F3D2FF 0%, transparent 55%),
      radial-gradient(900px 550px at 100% 10%, #FFD2E8 0%, transparent 60%),
      radial-gradient(1000px 700px at 50% 115%, #E7D2FF 0%, transparent 55%),
      var(--paper);
    background-attachment:fixed;
  }

  .app{
    width:100%;
    max-width:560px;
  }

  /* ---------- header ---------- */
  header{
    text-align:center;
    margin-bottom:28px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 8px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:clamp(28px, 6vw, 38px);
    letter-spacing:-0.01em;
    margin:0;
    background:linear-gradient(100deg, var(--estivo-deep) 0%, var(--speciale-deep) 50%, var(--invernale-deep) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  /* ---------- controls ---------- */
  .controls{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--card);
    border:2px solid var(--line);
    border-radius:999px;
    padding:6px;
    box-shadow:var(--shadow);
    margin-bottom:22px;
  }
  .controls button{
    border:none;
    background:transparent;
    color:var(--invernale-deep);
    width:38px;
    height:38px;
    border-radius:999px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex:0 0 auto;
    transition:background .15s ease, color .15s ease;
  }
  .controls button:hover{background:var(--invernale-soft); color:var(--invernale-deep);}
  .controls button:focus-visible, .date-input:focus-visible, .today-btn:focus-visible, .week-strip button:focus-visible{
    outline:2px solid var(--invernale);
    outline-offset:2px;
  }
  .controls svg{width:18px;height:18px;}
  .date-input{
    flex:1 1 auto;
    border:none;
    background:transparent;
    font-family:'IBM Plex Mono', monospace;
    font-size:14.5px;
    font-weight:500;
    color:var(--ink);
    padding:8px 4px;
    min-width:0;
    text-align:center;
  }
  .date-input::-webkit-calendar-picker-indicator{opacity:.55; cursor:pointer;}
  .today-btn{
    border:none;
    background:linear-gradient(120deg, var(--estivo-deep), var(--speciale-deep));
    color:#fff;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    font-weight:600;
    padding:0 16px;
    height:38px;
    border-radius:999px;
    cursor:pointer;
    flex:0 0 auto;
    transition:opacity .15s ease, transform .15s ease;
  }
  .today-btn:hover{opacity:.9; transform:translateY(-1px);}

  /* ---------- card ---------- */
  .card-wrap{
    position:relative;
  }
  .tab{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:7px 16px 7px 12px;
    border-radius:999px 999px 0 0;
    position:relative;
    top:1px;
    color:#fff;
    transition:background .35s ease, color .35s ease;
  }
  .tab .dot{
    width:16px;height:16px;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;
    line-height:1;
    flex:0 0 auto;
  }
  .tab .dot::before{content:'';}

  .card{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:2px var(--radius-lg) var(--radius-lg) var(--radius-lg);
    box-shadow:var(--shadow);
    padding:26px 26px 24px;
    transition:border-color .35s ease;
  }

  .season-estivo .tab{background:linear-gradient(120deg, var(--estivo), var(--estivo-deep)); border-color:var(--estivo-deep);}
  .season-invernale .tab{background:linear-gradient(120deg, var(--invernale), var(--invernale-deep)); border-color:var(--invernale-deep);}
  .season-speciale .tab{background:linear-gradient(120deg, var(--speciale), var(--speciale-deep)); border-color:var(--speciale-deep);}
  .season-closed .tab{background:var(--closed); color:#fff;}

  .season-estivo .card{border-color:var(--estivo-deep);}
  .season-invernale .card{border-color:var(--invernale-deep);}
  .season-speciale .card{border-color:var(--speciale-deep);}
  .season-closed .card{border-color:var(--line);}

  .season-estivo .tab .dot::before{content:'☀️';}
  .season-invernale .tab .dot::before{content:'❄️';}
  .season-speciale .tab .dot::before{content:'✨';}
  .season-closed .tab .dot::before{content:'🔒';}

  .meta-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:16px;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    font-weight:700;
    padding:5px 12px;
    border-radius:999px;
  }
  .season-estivo .badge{background:var(--estivo-soft); color:var(--estivo-ink);}
  .season-invernale .badge{background:var(--invernale-soft); color:var(--invernale-ink);}
  .season-speciale .badge{background:var(--speciale-soft); color:var(--speciale-ink);}

  .week-badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    font-weight:600;
    padding:5px 12px;
    border-radius:999px;
    background:var(--paper-2);
    color:var(--ink-soft);
  }

  .date-line{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(21px, 5vw, 26px);
    line-height:1.25;
    margin:0 0 18px;
    color:var(--ink);
  }
  .date-line .wd{display:block; font-size:.62em; font-weight:500; color:var(--ink-soft); margin-bottom:2px; font-family:'IBM Plex Sans', sans-serif; text-transform:uppercase; letter-spacing:.08em;}

  hr.divider{
    border:none;
    border-top:1px dashed var(--line);
    margin:0 0 18px;
  }

  .dishes{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:11px;
  }
  .dishes li{
    display:flex;
    gap:11px;
    align-items:flex-start;
    font-size:15.5px;
    line-height:1.4;
  }
  .dishes li::before{
    content:'';
    width:7px;height:7px;
    border-radius:50%;
    background:var(--ink-faint);
    margin-top:7px;
    flex:0 0 auto;
  }
  .season-estivo .dishes li::before{background:var(--estivo);}
  .season-invernale .dishes li::before{background:var(--invernale);}
  .season-speciale .dishes li::before{background:var(--speciale);}
  .dishes li.last{color:var(--ink-soft); font-size:14px;}
  .dishes li.last::before{background:var(--ink-faint) !important;}

  /* ---------- empty / closed states ---------- */
  .empty-state{
    display:flex;
    gap:14px;
    align-items:flex-start;
  }
  .empty-state svg{flex:0 0 auto; width:30px;height:30px; color:var(--ink-faint); margin-top:2px;}
  .empty-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19px;
    margin:0 0 4px;
  }
  .empty-text{
    font-size:14.5px;
    color:var(--ink-soft);
    margin:0;
    line-height:1.5;
  }

  /* ---------- week strip ---------- */
  .week-strip{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
    margin-top:20px;
  }
  .week-strip button{
    border:2px solid var(--line);
    background:var(--card);
    border-radius:var(--radius-md);
    padding:10px 4px 9px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    font-family:'IBM Plex Sans', sans-serif;
    transition:border-color .15s ease, background .15s ease, transform .15s ease;
  }
  .week-strip button:hover{border-color:var(--ink-faint); transform:translateY(-1px);}
  .week-strip .wlabel{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft);}
  .week-strip .wnum{font-family:'IBM Plex Mono', monospace; font-size:13px; font-weight:600; color:var(--ink);}
  .week-strip .wdot{width:8px;height:8px;border-radius:50%;background:var(--closed);}
  .week-strip button.wd-estivo{background:var(--estivo-soft); border-color:var(--estivo-soft);}
  .week-strip button.wd-estivo .wdot{background:var(--estivo-deep);}
  .week-strip button.wd-invernale{background:var(--invernale-soft); border-color:var(--invernale-soft);}
  .week-strip button.wd-invernale .wdot{background:var(--invernale-deep);}
  .week-strip button.wd-speciale{background:var(--speciale-soft); border-color:var(--speciale-soft);}
  .week-strip button.wd-speciale .wdot{background:var(--speciale-deep);}
  .week-strip button.active{border-color:var(--ink); box-shadow:0 0 0 2px var(--ink) inset;}
  .week-strip button.today .wnum{position:relative;}
  .week-strip button.today .wnum::after{
    content:'';
    position:absolute; left:50%; bottom:-5px; translate:-50% 0;
    width:5px;height:5px;border-radius:50%;background:var(--speciale-deep);
  }

  footer{
    text-align:center;
    margin-top:30px;
    font-size:12px;
    color:var(--ink-soft);
    font-weight:600;
    font-family:'IBM Plex Mono', monospace;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <p class="eyebrow">Città di Ciriè · Ristorazione scolastica</p>
    <h1>Menù del giorno</h1>
  </header>

  <div class="controls">
    <button id="prevBtn" aria-label="Giorno precedente" title="Giorno precedente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <input type="date" id="dateInput" class="date-input" aria-label="Seleziona data">
    <button id="nextBtn" aria-label="Giorno successivo" title="Giorno successivo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
    <button class="today-btn" id="todayBtn">Oggi</button>
  </div>

  <div class="card-wrap">
    <div id="tab" class="tab"><span class="dot"></span><span id="tabLabel">—</span></div>
    <div id="card" class="card">
      <!-- popolato via JS -->
    </div>
  </div>

  <div id="weekStrip" class="week-strip"></div>

  <footer>Comune di Ciriè — anno scolastico 2026/2027</footer>
</div>

const APP_START = '2026-09-14';
const APP_END = '2027-06-30';

const SPECIAL_MENUS = {
  /* Da compilare quando saranno definiti i menù speciali.
     Esempio:
     "2026-12-18": { nome: "Menù di Natale", piatti: ["Antipasto...", "Primo...", "Secondo...", "Frutta/pane"] }
  */
};

const WEEK_LABELS_ESTIVO = ['', 'Prima', 'Seconda', 'Terza', 'Quarta'];
const WEEK_LABELS_INVERNALE = ['', 'Prima', 'Seconda', 'Terza', 'Quarta', 'Quinta', 'Sesta', 'Settima', 'Ottava'];

const HOLIDAY_LABELS = {
  'weekend': 'Fine settimana',
  'SANTI': 'Festa di Ognissanti',
  'SAN FRANCESCO': 'San Francesco, Patrono di Ciriè',
  'IMMACOLATA': 'Immacolata Concezione',
  'sospensione lezioni': 'Sospensione delle lezioni',
  'vacanze natalizie': 'Vacanze di Natale',
  'NATALE': 'Natale',
  'S.STEFANO': 'Santo Stefano',
  'CAPODANNO': 'Capodanno',
  'EPIFANIA': 'Epifania',
  'vacanze carnevale': 'Vacanze di Carnevale',
  'vacanze pasquali': 'Vacanze di Pasqua',
  'SANTA PASQUA': 'Pasqua',
  "LUNEDÌ DELL'ANGELO": "Lunedì dell'Angelo",
  'FESTA DELLA LIBERAZIONE': 'Festa della Liberazione',
  'FESTA DEL LAVORO': 'Festa del Lavoro',
  'FESTA DELLA REPUBBLICA': 'Festa della Repubblica'
};

const MONTHS_IT = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];

function toISO(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fromISO(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function formatDateLong(d){
  return `${d.getDate()} ${MONTHS_IT[d.getMonth()]} ${d.getFullYear()}`;
}
function isoMondayOfWeek(d){
  const day = d.getDay(); // 0=sun..6=sat
  const diff = (day === 0 ? -6 : 1 - day);
  const monday = new Date(d);
  monday.setDate(d.getDate() + diff);
  return monday;
}

function getDayInfo(iso){
  // 1) menù speciale ha sempre precedenza
  if (SPECIAL_MENUS[iso]) {
    const sp = SPECIAL_MENUS[iso];
    return { status: 'speciale', weekdayIT: fromISOWeekday(iso), nome: sp.nome, piatti: sp.piatti };
  }
  // 2) fuori periodo di funzionamento dell'applicazione
  if (iso < APP_START || iso > APP_END) {
    return { status: 'fuori-periodo' };
  }
  // 3) tabella calcolata da calendario scolastico + rotazione menù
  const entry = MENU_TABLE[iso];
  if (!entry) return { status: 'fuori-periodo' };
  if (!entry.isOpen) {
    return { status: 'chiuso', weekdayIT: entry.weekdayIT, note: entry.note };
  }
  const piatti = MENU_DATA[entry.season][String(entry.week)][entry.menuGiorno];
  return {
    status: 'aperto',
    weekdayIT: entry.weekdayIT,
    season: entry.season,
    week: entry.week,
    menuGiorno: entry.menuGiorno,
    piatti
  };
}

function fromISOWeekday(iso){
  const d = fromISO(iso);
  const names = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
  return names[d.getDay()];
}

/* ====== RENDER ====== */
const tabEl = document.getElementById('tab');
const tabLabelEl = document.getElementById('tabLabel');
const cardEl = document.getElementById('card');
const dateInput = document.getElementById('dateInput');
const weekStripEl = document.getElementById('weekStrip');

function seasonClass(status, season){
  if (status === 'speciale') return 'season-speciale';
  if (status === 'aperto' && season === 'estivo') return 'season-estivo';
  if (status === 'aperto' && season === 'invernale') return 'season-invernale';
  return 'season-closed';
}

function render(iso){
  const info = getDayInfo(iso);
  const d = fromISO(iso);
  const wrap = document.querySelector('.card-wrap');
  const sClass = seasonClass(info.status, info.season);
  wrap.className = 'card-wrap ' + sClass;
  document.body.className = sClass;

  if (info.status === 'aperto' || info.status === 'speciale'){
    const isSpeciale = info.status === 'speciale';
    const seasonLabel = isSpeciale ? 'Speciale' : (info.season === 'estivo' ? 'Estivo' : 'Invernale');
    tabLabelEl.textContent = seasonLabel;

    let weekBadge = '';
    if (!isSpeciale){
      const labels = info.season === 'estivo' ? WEEK_LABELS_ESTIVO : WEEK_LABELS_INVERNALE;
      weekBadge = `<span class="week-badge">${labels[info.week]} settimana</span>`;
    }

    const piatti = info.piatti || [];
    const dishesHTML = piatti.map((p,i) => {
      const isLast = i === piatti.length - 1 && /frutta|pane/i.test(p);
      return `<li class="${isLast ? 'last' : ''}">${escapeHTML(p)}</li>`;
    }).join('');

    cardEl.innerHTML = `
      <div class="meta-row">
        <span class="badge">${seasonLabel}</span>
        ${weekBadge}
      </div>
      <p class="date-line"><span class="wd">${info.weekdayIT}</span>${formatDateLong(d)}</p>
      <hr class="divider">
      <ul class="dishes">${dishesHTML}</ul>
    `;
  } else if (info.status === 'chiuso'){
    tabLabelEl.textContent = 'Chiuso';
    const label = HOLIDAY_LABELS[info.note] || info.note || 'Giorno non scolastico';
    cardEl.innerHTML = `
      <div class="meta-row">
        <span class="badge" style="background:var(--closed-soft); color:var(--ink-soft);">Nessun servizio</span>
      </div>
      <p class="date-line"><span class="wd">${info.weekdayIT}</span>${formatDateLong(d)}</p>
      <hr class="divider">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><path d="M9 16l6 -6M15 16l-6 -6"></path></svg>
        <div>
          <p class="empty-title">Mensa non attiva</p>
          <p class="empty-text">${escapeHTML(label)}. Non è previsto il servizio di refezione scolastica in questa data.</p>
        </div>
      </div>
    `;
  } else {
    tabLabelEl.textContent = 'Fuori periodo';
    const startD = fromISO(APP_START), endD = fromISO(APP_END);
    cardEl.innerHTML = `
      <div class="meta-row">
        <span class="badge" style="background:var(--closed-soft); color:var(--ink-soft);">Fuori periodo</span>
      </div>
      <p class="date-line"><span class="wd">${fromISOWeekday(iso)}</span>${formatDateLong(d)}</p>
      <hr class="divider">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v4l2.5 2.5"></path></svg>
        <div>
          <p class="empty-title">Data fuori dal calendario scolastico</p>
          <p class="empty-text">Il menù del giorno è disponibile dal ${formatDateLong(startD)} al ${formatDateLong(endD)}.</p>
        </div>
      </div>
    `;
  }

  renderWeekStrip(iso);
  dateInput.value = iso;
}

function renderWeekStrip(iso){
  const d = fromISO(iso);
  const monday = isoMondayOfWeek(d);
  const todayISO = toISO(new Date());
  const labels = ['L','M','M','G','V'];
  let html = '';
  for (let i=0;i<5;i++){
    const day = new Date(monday);
    day.setDate(monday.getDate()+i);
    const dayISO = toISO(day);
    const info = getDayInfo(dayISO);
    let cls = 'wd-closed';
    if (info.status === 'speciale') cls = 'wd-speciale';
    else if (info.status === 'aperto') cls = info.season === 'estivo' ? 'wd-estivo' : 'wd-invernale';
    const isActive = dayISO === iso ? 'active' : '';
    const isToday = dayISO === todayISO ? 'today' : '';
    html += `<button type="button" class="${cls} ${isActive} ${isToday}" data-date="${dayISO}" aria-label="${info.weekdayIT || labels[i]} ${day.getDate()}">
      <span class="wlabel">${labels[i]}</span>
      <span class="wnum">${day.getDate()}</span>
      <span class="wdot"></span>
    </button>`;
  }
  weekStripEl.innerHTML = html;
  weekStripEl.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => render(btn.dataset.date));
  });
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ====== EVENTI ====== */
dateInput.addEventListener('change', () => {
  if (dateInput.value) render(dateInput.value);
});
document.getElementById('prevBtn').addEventListener('click', () => {
  const d = fromISO(dateInput.value || toISO(new Date()));
  d.setDate(d.getDate()-1);
  render(toISO(d));
});
document.getElementById('nextBtn').addEventListener('click', () => {
  const d = fromISO(dateInput.value || toISO(new Date()));
  d.setDate(d.getDate()+1);
  render(toISO(d));
});
document.getElementById('todayBtn').addEventListener('click', () => {
  render(toISO(new Date()));
});

/* ====== AVVIO ====== */
render(toISO(new Date()));

</script>
