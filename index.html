        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #667eea;
        }

        .menu-type {
            font-size: 1.4em;
            font-weight: bold;
            color: #667eea;
        }

        .menu-type.speciale {
            color: #e74c3c;
            font-size: 1.5em;
        }

        .menu-card.speciale {
            border: 3px solid #e74c3c;
            background: linear-gradient(135deg, #fff5f5 0%, #ffe8e8 100%);
        }

        .menu-card.speciale .menu-header {
            border-bottom: 3px solid #e74c3c;
        }

        .menu-card.speciale .menu-item:before {
            content: "⭐";
        }

        .menu-info {
            text-align: right;
        }

        .day-name {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .week-number {
            font-size: 1em;
            color: #666;
            font-style: italic;
        }

        .menu-content {
            font-size: 1.1em;
            line-height: 1.8;
            color: #444;
            white-space: pre-line;
        }

        .menu-item {
            margin-bottom: 12px;
            padding-left: 20px;
            position: relative;
        }

        .menu-item:before {
            content: "🍽️";
            position: absolute;
            left: 0;
        }

        .alert {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            color: #856404;
            font-size: 1.1em;
        }

        .alert.info {
            background: #d1ecf1;
            border-color: #17a2b8;
            color: #0c5460;
        }

        .alert.error {

        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 0.9em;
            border-top: 1px solid #eee;

        const vacanzeFestivita = [

        // Stato iniziale: 5 febbraio 2026, menù invernale, quinta settimana, giovedì
        const statoIniziale = {
            data: new Date("2026-02-05"),
            settimana: "QUINTA",
            giorno: "Giovedì",
            tipo: "invernale"
        };

        // Nomi settimane
        const settimaneInvernali = ["PRIMA", "SECONDA", "TERZA", "QUARTA", "QUINTA", "SESTA", "SETTIMA", "OTTAVA"];
        const settimaneEstive = ["PRIMA", "SECONDA", "TERZA", "QUARTA"];
        const giorniSettimana = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];

        function isWeekend(date) {
            const day = date.getDay();
            return day === 0 || day === 6;
        }

        function isVacanzaFestivita(dateStr) {
            return vacanzeFestivita.includes(dateStr);
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function parseDate(dateStr) {
            const parts = dateStr.split('-');
            return new Date(parts[0], parts[1] - 1, parts[2]);
        }

        function advanceMenuDay(currentWeek, currentDayName, currentType) {
            // Avanza al giorno successivo del menù (solo se è un giorno feriale di scuola)
            const dayIndex = giorniSettimana.indexOf(currentDayName);
            let nextDayIndex = dayIndex + 1;
            
            if (nextDayIndex > 5) { // Se supera venerdì
                nextDayIndex = 1; // Torna a lunedì
                // Avanza alla settimana successiva
                const weeks = currentType === "invernale" ? settimaneInvernali : settimaneEstive;
                const weekIndex = weeks.indexOf(currentWeek);
                const nextWeekIndex = (weekIndex + 1) % weeks.length;
                return {
                    settimana: weeks[nextWeekIndex],
                    giorno: giorniSettimana[nextDayIndex]
                };
            } else {
                return {
                    settimana: currentWeek,
                    giorno: giorniSettimana[nextDayIndex]
                };
            }
        }

        function getMenuForDate(targetDateStr) {
            const targetDate = parseDate(targetDateStr);
            
            // Controlla se è weekend
            if (isWeekend(targetDate)) {
                return {
                    error: "weekend",
                    message: "Il sabato e la domenica non sono previsti menù."
                };
            }

            // Controlla se è una vacanza o festività
            if (isVacanzaFestivita(targetDateStr)) {
                return {
                    error: "chiuso",
                    message: "La mensa è chiusa per vacanze o festività."
                };
            }

            // Verifica se c'è un menù speciale
            const menuSpeciale = menuSpeciali.find(m => m.data === targetDateStr);
            if (menuSpeciale) {
                return {
                    tipo: "Speciale",
                    menu: menuSpeciale.menu,
                    giorno: menuSpeciale.giorno,
                    settimana: null
                };
            }

            // Calcola il menù normale
            let currentDate = new Date(statoIniziale.data);
            let currentWeek = statoIniziale.settimana;
            let currentDay = statoIniziale.giorno;
            let currentType = statoIniziale.tipo;

            // Se la data richiesta è quella iniziale
            if (formatDate(targetDate) === formatDate(currentDate)) {
                const menu = menuInvernale[currentWeek][currentDay];
                return {
                    tipo: "Invernale",
                    menu: menu,
                    giorno: currentDay,
                    settimana: currentWeek
                };
            }

            // Avanza giorno per giorno fino alla data target
            while (formatDate(currentDate) !== targetDateStr) {
                currentDate = new Date(currentDate);
                currentDate.setDate(currentDate.getDate() + 1);

                // Se è un giorno feriale (lunedì-venerdì), avanza il menù
                // Il menù avanza anche durante vacanze/festività per mantenere la corrispondenza
                if (!isWeekend(currentDate)) {
                    const nextMenuInfo = advanceMenuDay(currentWeek, currentDay, currentType);
                    currentWeek = nextMenuInfo.settimana;
                    currentDay = nextMenuInfo.giorno;
                }

                // Verifica se è dopo le vacanze pasquali (passa a menù estivo)
                if (formatDate(currentDate) === "2026-04-08") { // Primo giorno dopo vacanze pasquali
                    currentType = "estivo";
                    currentWeek = "PRIMA";
                    currentDay = "Mercoledì";
                }
            }

            // Restituisci il menù
            const menuDb = currentType === "invernale" ? menuInvernale : menuEstivo;
            const menu = menuDb[currentWeek] ? menuDb[currentWeek][currentDay] : null;

            if (!menu) {
                return {
                    error: "not_found",
                    message: "Menù non disponibile per questa data."
                };
            }

            return {
                tipo: currentType === "invernale" ? "Invernale" : "Estivo",
                menu: menu,
                giorno: currentDay,
                settimana: currentWeek
            };
        }

        function displayMenu(result) {
            const display = document.getElementById('menuDisplay');

            if (result.error) {
                let message = result.message;
                let alertClass = 'error';
                
                if (result.error === 'weekend') {
                    alertClass = 'info';
                } else if (result.error === 'chiuso') {
                    alertClass = 'alert';
                }

                display.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
                return;
            }

            const menuItems = result.menu.split('\n').map(item => 
                `<div class="menu-item">${item}</div>`
            ).join('');

            const weekInfo = result.settimana ? 
                `<div class="week-number">Settimana: ${result.settimana}</div>` : '';

            const specialClass = result.tipo === 'Speciale' ? 'speciale' : '';

            display.innerHTML = `
                <div class="menu-card ${specialClass}">
                    <div class="menu-header">
                        <div class="menu-type ${result.tipo.toLowerCase()}">${result.tipo}</div>
                        <div class="menu-info">
                            <div class="day-name">${result.giorno}</div>
                            ${weekInfo}
                        </div>
                    </div>
                    <div class="menu-content">
                        ${menuItems}
                    </div>
                </div>
            `;
        }

        // Inizializza con la data di oggi
        document.addEventListener('DOMContentLoaded', function() {
            const dateInput = document.getElementById('menuDate');
            const today = '2026-02-05'; // Data iniziale
            dateInput.value = today;
            
            const result = getMenuForDate(today);
            displayMenu(result);

            dateInput.addEventListener('change', function() {
                const result = getMenuForDate(this.value);
                displayMenu(result);
            });
        });
    </script>
</body>
</html>
